databases:
  - name: assist-db
    plan: free
    databaseName: assist
    user: assist

services:
  - type: web
    name: assist-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: assist-db
          property: connectionString
      - key: CHROMA_DB_PATH
        value: ./data/chroma
      - key: PYTHON_VERSION
        value: "3.12.0"
