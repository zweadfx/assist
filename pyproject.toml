[project]
name = "assist"
version = "0.1.0"
description = "AI-powered basketball assistant for personalized training, gear recommendations, and rule clarifications."
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "Yongcheol Shin", email = "yongcheol008@gmail.com" },
]
dependencies = [
    "fastapi~=0.128",
    "uvicorn[standard]~=0.40",
    "langgraph~=1.0",
    "langchain-core~=1.2",
    "openai~=2.20",
    "chromadb~=1.5",
    "python-dotenv~=1.2",
    "pydantic-settings>=2.12.0",
    "pypdf>=5.1.0",
    "tenacity>=9.1.4",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "email-validator>=2.0",
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
dev = [
    "ruff"

]
[tool.ruff]
# As per Black standard
line-length = 88

[tool.ruff.lint]
# Select linter rules (E: pycodestyle errors, F: Pyflakes, I: isort)
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
